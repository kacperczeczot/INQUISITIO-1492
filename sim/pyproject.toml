[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inquisitio"
version = "0.1.0"
description = "INQUISITIO 1492 simulation engine with intrigue agents"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
inquisitio = "inquisitio.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["inquisitio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
