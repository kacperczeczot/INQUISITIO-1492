# ═══════════════════════════════════════════════════════════════════
# INQUISITIO-1492 — CENTRALNA KONFIGURACJA GRY
# ═══════════════════════════════════════════════════════════════════
#
# Ten plik jest JEDYNYM ŹRÓDŁEM PRAWDY dla wszystkich parametrów
# gry mierzonych w symulacji i opisanych w dokumentacji.
#
# Po zapisie zmian uruchom:
#   sim/.venv/bin/python tools/sync_config.py
# aby automatycznie propagować zmiany do:
#   • silnika symulacji (setup.py, win.py, turn.py, registry.py)
#   • dokumentacji zasad (docs/rules/ksiega.md)
#   • planszetk graczy (tools/pnp/generate.py)
#
# ═══════════════════════════════════════════════════════════════════


# ──────────────────────────────────────────────
# POZIOM 1: GŁÓWNE MECHANIKI SYSTEMOWE
# ──────────────────────────────────────────────
system:
  start_gold: 3              # Złoto startowe na gracza
  agents_per_player: 3       # Agenci na gracza
  hand_limit: 5              # Startowy limit kart na ręce
  max_eras: 8                # Maksymalny limit Er (koniec gry)
  autodafe_cooldown: 2       # Minimum Er pomiędzy Autodafé
  cards_per_era: 2           # Maksymalna liczba zagrań kart / Erę

  # Próg Herezji do Oskarżenia (wg liczby graczy)
  accusation_threshold:
    3p: 7
    4p: 8
    5p: 8


# ──────────────────────────────────────────────
# POZIOM 2: WARUNKI ZWYCIĘSTWA FRAKCJI
# ──────────────────────────────────────────────
victory:

  # ── Święte Oficjum ──
  swiete_oficjum:
    # Ścieżka A: Stosy (spalenie Agentów na Autodafé)
    stacks:
      3p: 2
      4p: 3
      5p: 5
    # Ścieżka B: Skazania (Werdykt Stołu)
    condemns:
      3p: 2
      4p: 3
      5p: 4

  # ── Cienie Al-Andalus ──
  cienie_al_andalus:
    relics: 2                # Relikwie do ewakuacji (wszystkie składy)
    # Era otwarcia ścieżki alternatywnej (Podwójny/cichy exit/szlak)
    path_era:
      3p: 6
      4p: 5
      5p: 5

  # ── Korona Borgiowie ──
  korona_borgiowie:
    # Ścieżka główna
    decrees:
      3p: 2
      4p: 2
      5p: 2
    hooks:
      3p: 0
      4p: 1
      5p: 1
    era:
      3p: 6
      4p: 5
      5p: 5
    # Ścieżka alternatywna (4p+): mniej Dekretów, więcej Haków
    alt_path:
      min_players: 4
      decrees: 1
      hooks: 2
      era: 6

  # ── Kabała Toledo ──
  kabala_toledo:
    fragments:
      3p: 2
      4p: 3
      5p: 2
    heresy_band: [3, 7]      # [min, max] wymaganej Herezji do zwycięstwa
    era:
      3p: 7
      4p: 6
      5p: 6

  # ── Gildia Cieni ──
  gildia_cieni:
    falls:
      default: 2             # Standardowa liczba Upadków do wygranej
      no_oficjum: 3          # Gdy brak Oficjum w grze


# ──────────────────────────────────────────────
# POZIOM 3: EKONOMIA KART I KOSZTY
# ──────────────────────────────────────────────
economy:
  card_cost_offset: 0        # Globalny modyfikator (opcjonalny)
  sig_cost_offset: 0         # Modyfikator kart Signature (opcjonalny)

# ──────────────────────────────────────────────
# POZIOM 3: PRECYZYJNE PARAMETRY KART 
# ──────────────────────────────────────────────
cards:
  # ── Święte Oficjum ──
  so-01: { name: "Patrol Familiariuszy", type: akcja, layer: A, cost: 1, agents: 1, action: move_agent }
  so-02: { name: "Skarbiec Trybunału", type: akcja, layer: A, cost: 1, gold: 2, action: gain_gold }
  so-03: { name: "Podejrzenie", type: akcja, layer: A, cost: 1, target_heresy: 1, action: frame_rival }
  so-04: { name: "Publiczne Ostrzeżenie", type: akcja, layer: A, cost: 1, action: send_inquisitor, target_loc: agent_location, inquisitor_send_limit: 1 }
  so-05: { name: "Wezwanie do Trybunału", type: reakcja, layer: A, cost: 0, target_heresy: 1, action: frame_rival, target_scope: triggering_rival, trigger: rival_plays_heresy_gte_1, no_move_limit: true }
  so-06: { name: "Areszt Trybunalski", type: akcja, layer: B, cost: 2, arrest: true, action: arrest, target_loc: same_location }
  so-07: { name: "Przesłuchanie Oficjum", type: akcja, layer: B, cost: 2, interrogate: true, action: interrogate, target_loc: dungeon, interrogate_limit: 1 }
  so-08: { name: "Nasłanie Inkwizytora", type: akcja, layer: B, cost: 2, heresy: 1, action: send_inquisitor, target_loc: same_location, inquisitor_send_limit: 1 }
  so-09: { name: "Świadek Koronny", type: akcja, layer: B, cost: 2, creates_hook: true, action: creates_hook, condition: rival_in_dungeon_or_inquisitor }
  so-10: { name: "Oczyść Miasto", type: signature, layer: C, cost: 4, heresy: 2, autodafe: true, action: autodafe, breaks_rule: "Autodafé / 2 Ery" }

  # ── Cienie Al-Andalus ──
  caa-01: { name: "Przejście Podziemiami", type: akcja, layer: A, cost: 1, agents: 1, action: move_agent }
  caa-02: { name: "Złoto z Kryjówki", type: akcja, layer: A, cost: 1, gold: 2, action: gain_gold }
  caa-03: { name: "Cień na Rynku", type: akcja, layer: A, cost: 1, heresy: 1, agents: 1, action: move_agent }
  caa-04: { name: "Fałszywy Trop", type: akcja, layer: A, cost: 1, target_heresy: 1, action: frame_rival }
  caa-05: { name: "Ukryty Kurier", type: akcja, layer: A, cost: 1, evacuate_relic: 1, action: evacuate_relic, condition: relic_present, kurier_limit: 1 }
  caa-06: { name: "Ucieczka z Lochów", type: akcja, layer: B, cost: 2, agents: 1, free_agent: true, action: free_agent, target_loc: dungeon }
  caa-07: { name: "Szantaż Bractwa", type: akcja, layer: B, cost: 2, creates_hook: true, action: creates_hook, target_loc: neighbor_location }
  caa-08: { name: "Kaptur Nocy", type: akcja, layer: B, cost: 1, heresy: 1, action: move_double_agent, condition: has_double_agent }
  caa-09: { name: "Kurier Relikwii", type: akcja, layer: C, cost: 2, move_relic: true, action: move_relic, target_loc: neighbor_location }
  caa-10: { name: "Echo Alhambry", type: signature, layer: C, cost: 1, heresy: 1, evacuate_relic: 2, action: evacuate_relic, max_relics: 2, condition: no_inquisitor_or_double_or_sea_route, breaks_rule: "Relikwia tylko ze Szlaku Morskiego" }

  # ── Korona Borgiowie ──
  kb-01: { name: "Rozkaz Dworu", type: akcja, layer: A, cost: 1, agents: 1, action: move_agent }
  kb-02: { name: "Pobór Podatków", type: akcja, layer: A, cost: 1, gold: 2, action: gain_gold }
  kb-03: { name: "Plotka Dworska", type: akcja, layer: A, cost: 1, target_heresy: 1, action: frame_rival }
  kb-04: { name: "Faworyt Dworu", type: akcja, layer: A, cost: 1, heresy: 1, agents: 1, creates_hook: true, action: creates_hook }
  kb-05: { name: "List Żelazny", type: akcja, layer: A, cost: 2, creates_hook: true, action: creates_hook }
  kb-06: { name: "Areszt Królewski", type: akcja, layer: B, cost: 2, arrest: true, action: arrest, target_loc: palace_or_same_location }
  kb-07: { name: "Szantaż Pieczęcią", type: akcja, layer: B, cost: 2, creates_hook: true, action: creates_hook, condition: heresy_gte_4 }
  kb-08: { name: "Przekupstwo Sędziego", type: akcja, layer: B, cost: 3, creates_hook: true, verdict_weight: 2, action: creates_hook }
  kb-09: { name: "Dekret Królewski", type: signature, layer: C, cost: 3, heresy: 1, decree: 1, penalty_heresy: 3, action: force_hook, breaks_rule: "1 wymuszenie Haka / gracza / Erę" }
  kb-10: { name: "Pieczęć Korony", type: signature, layer: C, cost: 2, heresy: 2, decree: 2, action: check_victory, condition: active_hooks_gte_2, breaks_rule: "zwycięstwo tylko po Erze" }

  # ── Kabała Toledo ──
  kt-01: { name: "Rytuał Przejścia", type: akcja, layer: A, cost: 1, agents: 1, action: move_agent }
  kt-02: { name: "Transmutacja Złota", type: akcja, layer: A, cost: 1, gold: 2, action: gain_gold }
  kt-03: { name: "Zakazana Wiedza", type: akcja, layer: A, cost: 0, heresy: 1, grant_fragment: 1, action: grant_fragment }
  kt-04: { name: "Zwierciadło Herezji", type: akcja, layer: A, cost: 1, target_heresy: 1, action: frame_rival }
  kt-05: { name: "Wskazówka Cyklu", type: akcja, layer: A, cost: 1, grant_fragment: 1, action: grant_fragment_or_gold, condition: agent_in_dungeon_or_tribunal }
  kt-06: { name: "Przesłuchanie Imienia", type: akcja, layer: B, cost: 2, interrogate: true, grant_fragment: 1, interrogate_limit: 1, action: interrogate, bonus_on_heresy: grant_fragment }
  kt-07: { name: "Archiwum Ukryte", type: akcja, layer: B, cost: 1, creates_hook: true, action: creates_hook, condition: heresy_gte_4 }
  kt-08: { name: "Areszt Wiedzy", type: akcja, layer: B, cost: 2, arrest: true, action: arrest, target_loc: dungeon_or_tribunal }
  kt-09: { name: "Fragment Kodeksu", type: akcja, layer: C, cost: 1, heresy: 1, grant_fragment: 1, action: grant_fragment, condition: has_fragment_and_agent_in_dungeon_or_tribunal }
  kt-10: { name: "Pieczęć Salomona", type: signature, layer: C, cost: 1, action: check_victory_or_set_heresy, condition: fragments_eq_3, target_heresy_band: [4, 6], fallback_heresy: 5, breaks_rule: "Herezja tylko z karty" }

  # ── Gildia Cieni ──
  gc-01: { name: "Przekupiony Strażnik", type: akcja, layer: A, cost: 1, agents: 1, action: move_agent }
  gc-02: { name: "Czarny Rynek", type: akcja, layer: A, cost: 1, gold: 2, action: gain_gold }
  gc-03: { name: "Podrzucenie Księgi", type: akcja, layer: A, cost: 1, target_heresy: 1, action: frame_rival }
  gc-04: { name: "Informator", type: akcja, layer: A, cost: 1, heresy: 1, creates_hook: true, action: creates_hook }
  gc-05: { name: "Fałszywy Świadek", type: reakcja, layer: A, cost: 0, change_vote: true, vote_change_limit: 1, action: change_vote, trigger: after_verdict_majority_revealed }
  gc-06: { name: "Szantaż", type: akcja, layer: B, cost: 2, creates_hook: true, action: creates_hook }
  gc-07: { name: "Skrytobójstwo", type: akcja, layer: B, cost: 2, heresy: 1, arrest: true, action: arrest, target_loc: guild_or_market }
  gc-08: { name: "Zatrute Złoto", type: akcja, layer: B, cost: 1, target_heresy: 1, gold: 1, action: gain_gold_and_frame }
  gc-09: { name: "Lista Dłużników", type: akcja, layer: C, cost: 2, creates_hook: true, mark_fall: true, action: creates_hook, on_refusal: mark_fall }
  gc-10: { name: "Upadek Domu", type: signature, layer: C, cost: 3, heresy: 2, mark_fall: true, action: mark_fall, condition: rival_has_hook_or_double_or_autodafe, breaks_rule: "Upadek tylko z odmowy Haka" }


# ──────────────────────────────────────────────
# POZIOM 4: WARIANTY NISZOWE I MODYFIKATORY
# ──────────────────────────────────────────────
variants:
  time_deck_freq: 1          # Co ile Er odkrywamy edykt (1 = co Erę)
  sea_route_era: 5           # Era otwarcia Szlaku Morskiego dla Cieni
  inquisitor_speed: 1        # Ruch Inkwizytora (0/1/2 pola)


# ──────────────────────────────────────────────
# STREFY HEREZJI (tor planszetek gracza)
# ──────────────────────────────────────────────
heresy_zones:
  clean: [0, 3]              # Strefa Czysta
  observed:
    3p: [4, 6]               # Strefa Obserwowana w 3-osobowym
    4p_plus: [4, 7]          # Strefa Obserwowana w 4-5-osobowym
  critical:
    3p: 7                    # Początek strefy Krytycznej w 3-osobowym
    4p_plus: 8               # Początek strefy Krytycznej w 4-5-osobowym


# ──────────────────────────────────────────────
# NORMY TELEMETRYCZNE (cele balansowe symulacji)
# ──────────────────────────────────────────────
telemetry_norms:
  game_length_eras: [5.0, 7.0]     # Optymalna długość gry w Erach
  deadlock_pct_max: 15.0            # Maks. % gier zakończonych limitem Er
  poverty_pct_max: 30.0             # Maks. % tur z wymuszonym pasowaniem
  autodafe_per_game: [0.5, 2.0]     # Optymalny zakres Autodafé / partię
  accusations_per_game: [1.5, 4.5]  # Optymalny zakres oskarżeń / partię

  # Bramki celów balansowych (win share per frakcja)
  balance_targets:
    3p:
      target: [0.28, 0.38]          # Cel ścisły
      critical: [0.20, 0.45]        # Czerwona linia
    4p:
      target: [0.20, 0.30]
      critical: [0.15, 0.35]
    5p:
      target: [0.16, 0.24]
      critical: [0.10, 0.30]
